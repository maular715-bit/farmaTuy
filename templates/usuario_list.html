{% extends 'base.html' %}
{% block title %}Usuarios{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Usuarios</h1>
  <a class="btn btn-success" href="{% url 'usuario_create' %}">Nuevo Usuario</a>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Rol</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for u in usuarios %}
    <tr>
      <td><a href="{% url 'usuario_edit' u.id %}">{{ u.nombre }}</a></td>
      <td>{{ u.email }}</td>
      <td>{{ u.rol }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{% url 'usuario_edit' u.id %}">Editar</a>
        <form method="post" action="{% url 'usuario_delete' u.id %}" style="display:inline">{% csrf_token %}
          <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No hay usuarios</td></tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
