<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FarmaTuy - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">FarmaTuy</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/farmacias/">Farmacias</a></li>
            <li class="nav-item"><a class="nav-link" href="/medicamentos/">Medicamentos</a></li>
            <li class="nav-item"><a class="nav-link" href="/inventario/">Inventario</a></li>
            <li class="nav-item"><a class="nav-link" href="/tipos/">Tipos</a></li>
            <li class="nav-item"><a class="nav-link" href="/usuarios/">Usuarios</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'public_search' %}">Buscar productos</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/search.js"></script>
  </body>
</html>
